<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <section id="login">
        <div class="d-flex justify-content-between align-items-center p-3 bg-white shadow-sm">
    <div class="d-flex align-items-center gap-2">
      <img src="./images/6b20415fedac8b4ec9a195f79e28cf4c95c69be1.png" width="30">
      <h5 class="mb-0 text-warning">Minimal <span class="text-danger">Shop</span>ping</h5>
    </div>
    <i class="fa-solid fa-user text-secondary"></i>
  </div>

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    
    <div class="p-5 rounded text-center w-100 " style="background-color: #00000006;" >
      
      <h3>Hello Again!</h3>
      <p class="text-muted">Welcome Back You’ve Been Missed!</p>
      
      <form class="text-start" style="width: 600px;">
        <p class="text-start w-100">To login enter Your email address and password</p>
        <label class="fw-bold">Email Address</label>
        <div class="position-relative mb-3">
          <input type="email" class="form-control border-0 border-bottom rounded-0" style="background-color: transparent;">
          <i class="fa-solid fa-eye-slash position-absolute end-0 top-50 translate-middle-y text-warning"></i>
        </div>

        <label class="fw-bold">Password</label>
        <div class="position-relative mb-3">
          <input type="password" class="form-control border-0 border-bottom rounded-0" style="background-color: transparent;">
          <i class="fa-solid fa-eye-slash position-absolute end-0 top-50 translate-middle-y text-warning"></i>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" id="save" type="checkbox" style="accent-color: #F8B326;">
          <label class="form-check-label" style="padding-left: 3px ;" for="save">Remember me</label>
        </div>

        <div class="text-center">
          <button class="btn px-5 rounded-pill fw-bold" style="color:#F61B5A; background: white;">
            Login
          </button>
        </div>
      </form>

    </div>
  </div>
    </section>
</body>
</html>
